[project]
name = "okapi-copilot"
version = "0.1.0"
description = "Okapi Copilot — intelligence, orchestration, knowledge and governed automation platform for the Okapi SaaS ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "surrealdb>=0.3,<1.0",
    "redis>=5.0,<6.0",
    "aio-pika>=9.4,<10.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "cryptography>=42.0,<46.0",
    "httpx>=0.27,<1.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-python-jose>=3.3,<4.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okapi_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
disallow_untyped_defs = true
warn_return_any = true

# The domain layer is held to the strictest bar: no framework imports allowed.
[[tool.mypy.overrides]]
module = "okapi_copilot.domain.*"
disallow_any_generics = true

# surrealdb ships no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = "surrealdb.*"
ignore_missing_imports = true
